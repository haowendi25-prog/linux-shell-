# DiagMaster 全局配置文件
# 可根据实际环境修改

# 性能阈值
CPU_WARN_THRESHOLD=80
MEM_WARN_THRESHOLD=85
DISK_WARN_THRESHOLD=90

# 登录认证（仅用于演示，生产环境请勿明文存储）
ADMIN_USER="admin"
ADMIN_PASS="12345"

# 巡逻配置
# WSL 环境下 sshd/cron 等传统守护进程不存在
# 请根据实际运行中的进程名配置，用空格分隔
SERVICES_TO_CHECK="bash init"
PROCESSES_TO_CHECK="bash init"

# 告警开关 (true/false)
ENABLE_ALERT=false
ALERT_EMAIL="admin@example.com"

# 巡逻守护进程间隔（秒），默认 300 秒 = 5 分钟
PATROL_INTERVAL=300

# 报告目录
PATROL_REPORT_DIR="./reports"

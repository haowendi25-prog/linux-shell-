# DiagMaster 全局配置文件
# 可根据实际环境修改

# 性能阈值
CPU_WARN_THRESHOLD=80
MEM_WARN_THRESHOLD=85
DISK_WARN_THRESHOLD=90

# 登录认证（仅用于演示，生产环境请勿明文存储）
ADMIN_USER="admin"
ADMIN_PASS="12345"

# 巡逻配置
SERVICES_TO_CHECK="sshd cron"
PROCESSES_TO_CHECK="sshd"

# 告警开关 (true/false)
ENABLE_ALERT=false
ALERT_EMAIL="admin@example.com"

# 报告目录
PATROL_REPORT_DIR="./reports"